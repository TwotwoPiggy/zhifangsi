name: Publish NPM Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install Dependencies
        run: npm ci

      - name: Build, Run Unit Tests & Self Verification
        run: |
          npm run build
          npm test
          node ./bin/zhifangsi.mjs --version
          node ./bin/zhifangsi.mjs map
          node ./bin/zhifangsi.mjs check

      - name: Publish to NPM
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Authenticating with NPM_TOKEN secret..."
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          else
            echo "Authenticating with npm OIDC Trusted Publishing..."
          fi
          npm publish --provenance --access public
