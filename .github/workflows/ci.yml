name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Build
        run: |
          npm run typecheck
          npm run build

      - name: Run Unit Tests & CLI Verification
        run: |
          npm test
          node ./bin/zhifangsi.mjs --version
          node ./bin/zhifangsi.mjs map
          node ./bin/zhifangsi.mjs check
